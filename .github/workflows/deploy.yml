name: Deploy UI5 App to GitHub Pages

# Publica o `dist` na branch `gh-pages`, que e a fonte do GitHub Pages deste
# repositorio (Settings > Pages > Deploy from a branch: gh-pages / root).
#
# O arquivo `.nojekyll` no dist e obrigatorio: sem ele o Pages passa os
# arquivos pelo Jekyll, que IGNORA pastas e arquivos iniciados por "_" - e o
# bundle do jsPDF tem `thirdparty/_dynamics/` e `_commonjsHelpers.js` (o
# "Ver PDF" quebraria no site).
#
# Os certificados (Credly) e repositorios (GitHub) sao buscados AQUI, no build,
# e nao no navegador: o credly.com nao envia CORS. O agendamento diario
# republica o site para badges e estrelas novas aparecerem sozinhas. (O commit
# do sync-content.yml usa [skip ci] e nao dispara este workflow.)

on:
    push:
        branches:
            - main
    schedule:
        # 06:30 UTC (03:30 no Brasil), depois do sync-content.yml.
        - cron: "30 6 * * *"
    workflow_dispatch:

# Escrita no repositorio: o deploy faz push na branch gh-pages.
permissions:
    contents: write

# Um deploy de cada vez; um novo push cancela o build anterior ainda em curso.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Falha de rede/limite em uma das fontes nao derruba o deploy: o JSON
            # versionado em webapp/content continua valendo.
            - name: Sync GitHub data
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm run sync:github

            - name: Scrape Credly certificates
              continue-on-error: true
              run: npm run scrape:certificates

            - name: Validate content
              run: npm run content:check

            # PDF estatico (webapp/cv/ esta no .gitignore). O botao "Ver PDF" gera
            # o arquivo na hora no navegador; este e a alternativa se isso falhar.
            - name: Generate CV PDF
              run: npm run cv:pdf

            - name: Build UI5 Project (Transpile TS to JS)
              run: npm run build

            # Seguro extra caso o Pages volte a ser servido por branch.
            # Desliga o Jekyll no Pages (ver comentario no topo).
            - name: Disable Jekyll
              run: touch dist/.nojekyll

            - name: Deploy to gh-pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist
                  branch: gh-pages
                  clean: true
